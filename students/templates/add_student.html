{% extends "base.html" %}
{% block content %}
<h1>Add Student</h1>
<form method="POST">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name">
    <label>Dance Form:</label>
    <input type="text" name="dance_form">
    <label>Batch:</label>
    <input type="text" name="batch">
    <label>Phone:</label>
    <input type="number" name="phone">
    <button type="submit">Save Student</button>
</form>
{% endblock %}
