{% extends "base.html" %}
{% block content %}
<h1>Sign Up</h1>
<form method="POST">
    {% csrf_token %}
    <label>Username</label>
    {{ form.username }}
    <label>Password</label>
    {{ form.password1 }}
    <label>Confirm Password</label>
    {{ form.password2 }}
    <button type="submit">Sign Up</button>
</form>
{% endblock %}
